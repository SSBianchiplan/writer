name: 🐞 Problema (bug)
description: Algo não funciona como deveria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Obrigado por relatar! **Não inclua documentos reais, e-mails de pessoas ou chaves.** Falhas de segurança vão por e-mail (ver SECURITY.md)."
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Abrir…\n2. Clicar em…\n3. Ver o erro…"
    validations:
      required: true
  - type: dropdown
    id: onde
    attributes:
      label: Onde
      options:
        - writer.gplansis.com
        - Instalação local (versão servidor)
        - Arquivo único (standalone)
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador e sistema
      placeholder: "Chrome 141 no Windows 11, Safari no iPhone…"
  - type: textarea
    id: extra
    attributes:
      label: Capturas de tela, arquivo de exemplo ou mensagens do console
